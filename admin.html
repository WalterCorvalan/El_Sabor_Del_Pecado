<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | El Sabor del Pecado</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .admin-wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
    .admin-card {
      background: var(--card-bg);
      border: 1px solid var(--card-borde);
      border-radius: var(--radio);
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: var(--card-sombra);
    }
    .admin-card h3 {
      margin-top: 0;
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.3px;
      font-size: 19px;
      color: var(--rojo);
    }
    .admin-grid { display: grid; gap: 14px; }
    .admin-product {
      background: var(--bg);
      border: 1px solid var(--card-borde);
      border-radius: 12px;
      padding: 14px;
    }
    .admin-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .admin-row > * { flex: 1; min-width: 140px; }
    .admin-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-danger { background: var(--rojo-oscuro); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; }
    .btn-danger:hover { background: #6e0000; }
    .btn-small { padding: 6px 12px; font-size: 13px; }
    .login-screen { max-width: 360px; margin: 80px auto; padding: 0 16px; text-align: center; }
    .hidden { display: none !important; }
    .variant-admin {
      background: #fff;
      border: 1px solid var(--card-borde);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
    }
    .admin-msg { font-size: 13px; margin-top: 8px; min-height: 16px; }
    .admin-msg.error { color: var(--rojo-oscuro); font-weight: 700; }
    .admin-msg.ok { color: #2e7d32; font-weight: 700; }

    .admin-wrap label,
    .login-screen label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }

    .admin-wrap input[type="text"],
    .admin-wrap input[type="tel"],
    .admin-wrap textarea,
    .login-screen input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--card-borde);
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-body);
    }

    .admin-wrap input:focus,
    .login-screen input:focus,
    .admin-wrap textarea:focus {
      outline: none;
      border-color: var(--rojo);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="flame">🔥</span>
      <h1>Admin — El Sabor del Pecado</h1>
      <small>PANEL PRIVADO</small>
    </div>
    <button class="btn-outline hidden" id="logoutBtn" style="width:auto;">Salir</button>
  </header>

  <div class="login-screen" id="loginScreen">
    <div class="admin-card">
      <h3>Ingresar</h3>
      <div class="field">
        <label for="adminPassword">Contraseña</label>
        <input type="password" id="adminPassword" placeholder="Contraseña de administrador" />
      </div>
      <button class="btn-gold" id="loginBtn" style="width:100%;">Ingresar</button>
      <div class="admin-msg error" id="loginMsg"></div>
    </div>
  </div>

  <div class="admin-wrap hidden" id="adminPanel">
    <div class="admin-card">
      <h3>Configuración general</h3>
      <div class="field">
        <label for="whatsappNumber">Número de WhatsApp (solo dígitos, con código de país. Ej: 5491122334455)</label>
        <input type="text" id="whatsappNumber" />
      </div>
    </div>

    <div class="admin-card">
      <h3>Categorías</h3>
      <div id="categoriesList" class="admin-grid"></div>
      <div class="admin-row" style="margin-top:12px;">
        <input type="text" id="newCategoryName" placeholder="Nombre de nueva categoría" />
        <button class="btn-add" id="addCategoryBtn" style="flex:0 0 auto;">+ Agregar categoría</button>
      </div>
    </div>

    <div class="admin-card">
      <h3>Guardar cambios</h3>
      <button class="btn-gold" id="saveBtn">Guardar catálogo</button>
      <div class="admin-msg" id="saveMsg"></div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
