<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#140706" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin | El Sabor del Pecado</title>
  <link rel="icon" type="image/png" href="images/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <!-- Ingreso -->
  <section class="login" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">El Sabor<br>del Pecado</div>
      <div class="login-sub">Panel privado</div>
      <input type="password" id="adminPassword" placeholder="Contraseña" autocomplete="current-password" />
      <button class="btn btn-gold btn-block" id="loginBtn" type="button">Ingresar</button>
      <div class="login-msg" id="loginMsg" role="alert"></div>
    </div>
  </section>

  <!-- Panel -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <strong>El Sabor del Pecado</strong>
          <small>Administración</small>
        </div>
        <a class="btn btn-ghost-dark btn-sm" href="/" target="_blank" rel="noopener">Ver sitio</a>
        <button class="btn btn-ghost-dark btn-sm" id="logoutBtn" type="button">Salir</button>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" type="button" data-tab="menu">Menú</button>
        <button class="tab" type="button" data-tab="ajustes">Ajustes</button>
      </nav>
    </header>

    <main class="wrap">
      <section id="tabMenu"></section>
      <section id="tabAjustes" class="hidden"></section>
    </main>

    <div class="savebar" id="savebar" aria-live="polite">
      <div class="savebar-inner">
        <span id="savebarText">Tenés cambios sin guardar</span>
        <button class="btn btn-gold" id="saveBtn" type="button">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/admin.js"></script>
</body>
</html>
