<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#8e0000" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Seguí tu pedido | El Sabor del Pecado</title>
  <link rel="icon" type="image/png" href="images/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rojo: #c62828;
      --rojo-oscuro: #8e0000;
      --negro: #140706;
      --dorado: #ffc107;
      --verde: #2ebd6b;
      --font-display: "Lilita One", "Segoe UI", sans-serif;
      --font-body: "Nunito", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: #fff8f0;
      background: radial-gradient(circle at 50% -10%, rgba(255, 193, 7, 0.14), transparent 55%),
        linear-gradient(165deg, #2b0808 0%, #8e0000 45%, #140706 100%);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
      padding: calc(22px + env(safe-area-inset-top, 0px)) 18px calc(30px + env(safe-area-inset-bottom, 0px));
    }

    .logo {
      display: block;
      width: 150px;
      aspect-ratio: 900 / 740;
      margin: 0 auto 6px;
      background: linear-gradient(180deg, #ffe27a 0%, #f5b400 55%, #ff8a1f 100%);
      -webkit-mask: url("images/logo-mask.png") center / contain no-repeat;
      mask: url("images/logo-mask.png") center / contain no-repeat;
      filter: drop-shadow(0 3px 0 rgba(90, 0, 0, 0.55));
    }

    .card {
      background: rgba(20, 7, 6, 0.78);
      border: 1px solid rgba(255, 193, 7, 0.25);
      border-radius: 24px;
      padding: 22px 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
    }

    .num { font-family: var(--font-display); font-size: 34px; color: var(--dorado); text-align: center; margin: 0; }
    .headline { text-align: center; font-size: 19px; font-weight: 800; margin: 6px 0 4px; }
    .sub { text-align: center; color: #d8cfc5; font-size: 14px; margin: 0 0 18px; line-height: 1.45; }

    .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
    .step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; position: relative; padding-bottom: 18px; }
    .step:last-child { padding-bottom: 0; }
    .step::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 34px;
      bottom: 0;
      width: 2px;
      background: rgba(255, 255, 255, 0.15);
    }
    .step:last-child::before { display: none; }
    .step.done::before { background: var(--verde); }

    .dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.1);
      color: #d8cfc5;
      font-weight: 800;
      font-size: 14px;
    }
    .step.done .dot { background: var(--verde); color: #fff; }
    .step.current .dot { background: var(--dorado); color: var(--negro); box-shadow: 0 0 0 6px rgba(255, 193, 7, 0.22); animation: pulse 1.6s ease-in-out infinite; }

    .label { font-weight: 800; padding-top: 5px; }
    .step:not(.done):not(.current) .label { color: #a99e94; }
    .hint { display: block; font-weight: 600; font-size: 13px; color: #d8cfc5; margin-top: 2px; }

    @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(255, 193, 7, 0); } }
    @media (prefers-reduced-motion: reduce) { .step.current .dot { animation: none; } }

    .meta { margin-top: 20px; padding-top: 14px; border-top: 1px dashed rgba(255, 255, 255, 0.18); display: grid; gap: 6px; font-size: 14px; }
    .meta div { display: flex; justify-content: space-between; gap: 10px; }
    .meta strong { color: var(--dorado); }

    .cancelled { text-align: center; padding: 6px 0; }
    .cancelled .big { font-size: 40px; }

    .btn {
      display: block;
      margin: 18px auto 0;
      text-align: center;
      padding: 13px 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffd34d, var(--dorado));
      color: var(--negro);
      font-weight: 800;
      text-decoration: none;
    }

    .error { text-align: center; color: #ffd0cc; line-height: 1.5; }
    .updated { text-align: center; font-size: 12px; color: #a99e94; margin-top: 14px; }
  </style>
</head>
<body>
  <main class="wrap">
    <span class="logo" role="img" aria-label="El Sabor del Pecado"></span>
    <section class="card" id="card" aria-live="polite">
      <p class="sub">Cargando tu pedido...</p>
    </section>
    <p class="updated" id="updated"></p>
    <a class="btn" href="/">Volver al menú</a>
  </main>

  <script>
    (() => {
      "use strict";

      const STEPS = [
        { key: "nuevo", label: "Recibimos tu pedido", hint: "El local ya lo vio." },
        { key: "preparando", label: "Lo estamos preparando", hint: "Está en la cocina." },
        { key: "listo", label: "Listo", hint: "" },
        { key: "entregado", label: "Entregado", hint: "¡Que lo disfrutes!" }
      ];
      const POLL_MS = 15000;

      const card = document.getElementById("card");
      const updated = document.getElementById("updated");
      const id = new URLSearchParams(location.search).get("o") || "";
      let timer = null;

      function money(n) {
        return "$" + Number(n).toLocaleString("es-AR");
      }

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      function showError(message) {
        card.innerHTML = `<p class="error">${esc(message)}</p>`;
        updated.textContent = "";
      }

      function render(order) {
        const isDelivery = order.shipping === "Envío a domicilio";
        const num = `#${String(order.number).padStart(4, "0")}`;

        if (order.status === "cancelado") {
          card.innerHTML = `
            <p class="num">${esc(num)}</p>
            <div class="cancelled">
              <div class="big" aria-hidden="true">✖</div>
              <p class="headline">Este pedido fue cancelado</p>
              <p class="sub">Si tenés dudas, escribinos por WhatsApp.</p>
            </div>`;
          return;
        }

        const currentIndex = Math.max(0, STEPS.findIndex((s) => s.key === order.status));
        const steps = STEPS.map((step, i) => {
          const state = i < currentIndex ? "done" : i === currentIndex ? "current" : "";
          const label = step.key === "listo" ? (isDelivery ? "Listo, sale para tu casa" : "Listo para retirar") : step.label;
          const hint = i === currentIndex && step.hint ? `<span class="hint">${esc(step.hint)}</span>` : "";
          const mark = state === "done" ? "✓" : String(i + 1);
          return `<li class="step ${state}"><span class="dot">${mark}</span><span class="label">${esc(label)}${hint}</span></li>`;
        }).join("");

        const finished = order.status === "entregado";
        const headline = finished ? "¡Pedido entregado!" : "Estamos con tu pedido";
        const sub = finished
          ? "Gracias por elegirnos."
          : order.eta
            ? `Tiempo estimado: ${esc(order.eta)} min`
            : "Esta página se actualiza sola.";

        card.innerHTML = `
          <p class="num">${esc(num)}</p>
          <p class="headline">${headline}</p>
          <p class="sub">${sub}</p>
          <ol class="steps">${steps}</ol>
          <div class="meta">
            <div><span>Entrega</span><strong>${isDelivery ? "A domicilio" : "Retiro en el local"}</strong></div>
            <div><span>Total</span><strong>${money(order.total)}</strong></div>
          </div>`;
      }

      async function load() {
        if (!/^\d+-[a-f0-9]{16}$/.test(id)) {
          showError("Este link no es válido. Volvé a abrirlo desde el mensaje de WhatsApp.");
          return;
        }
        try {
          const res = await fetch(`/api/track?id=${encodeURIComponent(id)}`, { cache: "no-store" });
          if (res.status === 404) {
            showError("No encontramos este pedido. Puede que ya haya sido eliminado.");
            clearInterval(timer);
            return;
          }
          if (!res.ok) throw new Error("track " + res.status);
          const order = await res.json();
          render(order);
          const now = new Date();
          updated.textContent = `Actualizado ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
          if (order.status === "entregado" || order.status === "cancelado") clearInterval(timer);
        } catch (err) {
          console.error(err);
          if (!card.querySelector(".steps")) showError("No pudimos cargar el estado. Probá de nuevo en un momento.");
        }
      }

      load();
      timer = setInterval(() => {
        if (!document.hidden) load();
      }, POLL_MS);
    })();
  </script>
</body>
</html>
